name: Radar de Precos

on:
  schedule:
    # A cada 2 horas. Horario UTC (Brasilia = UTC-3).
    - cron: "5 */2 * * *"
  workflow_dispatch:        # permite rodar na mao pelo botao "Run workflow"

permissions:
  contents: write           # necessario para commitar o banco de precos
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar precos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python -m radar coletar

      - name: Processar aprovacoes pendentes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          ENCURTADOR_BASE: ${{ secrets.ENCURTADOR_BASE }}
        run: python -m radar aprovacoes

      - name: Detectar quedas e enviar candidatos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m radar detectar

      - name: Gerar o site
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          ENCURTADOR_BASE: ${{ secrets.ENCURTADOR_BASE }}
        run: python -m radar site

      - name: Guardar o historico no repositorio
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados/precos.db
          git diff --staged --quiet || git commit -m "precos: rodada de $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: rodada
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

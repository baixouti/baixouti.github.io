# ---------------------------------------------------------------------------
# Termos de busca para montar o catalogo automaticamente.
#
#   python scripts/montar_catalogo.py
#
# O script busca cada termo no Mercado Livre, filtra o lixo e escreve
# catalogo.csv com IDs e precos REAIS.
#
# Os termos abaixo foram escolhidos por um criterio so: OSCILACAO DE PRECO.
# Um bot de preco so serve se o preco se mexer. Produto de preco estavel nao
# gera post nenhum, por mais popular que seja.
#
# faixa: baixa (< R$150) | media (R$150-800) | alta (> R$800)
# ---------------------------------------------------------------------------

# --- componentes: oscilam quase toda semana, os melhores geradores de post ---
componentes:
  faixa_padrao: media
  termos:
    - ssd nvme 1tb
    - ssd nvme 2tb
    - ssd sata 480gb
    - memoria ram ddr4 16gb
    - memoria ram ddr5 16gb
    - memoria ram ddr5 32gb
    - hd externo 2tb

# --- perifericos: muitas marcas competindo, promocao constante ---
perifericos:
  faixa_padrao: media
  termos:
    - teclado mecanico abnt2
    - teclado mecanico 75 porcento
    - teclado sem fio abnt2
    - mouse sem fio ergonomico
    - mousepad speed grande
    - headset com microfone usb
    - webcam full hd 1080p
    - microfone usb condensador

# --- monitores e video: ticket alto, quedas grandes em datas ---
monitores:
  faixa_padrao: alta
  termos:
    - monitor 27 polegadas qhd ips
    - monitor 24 polegadas full hd ips
    - monitor ultrawide 29 polegadas
    - suporte articulado para monitor

# --- conectividade: necessidade real de quem trabalha em notebook ---
conectividade:
  faixa_padrao: media
  termos:
    - dock station usb c notebook
    - hub usb c hdmi
    - adaptador usb ethernet gigabit
    - switch gigabit 8 portas
    - roteador wifi 6

# --- energia: ninguem lembra ate precisar ---
energia:
  faixa_padrao: media
  termos:
    - nobreak 1200va
    - estabilizador 1000va
    - filtro de linha 8 tomadas

# --- ergonomia e mesa: dor real de quem trabalha sentado ---
ergonomia:
  faixa_padrao: alta
  termos:
    - cadeira ergonomica escritorio
    - suporte para notebook aluminio
    - apoio de pes ergonomico
    - luminaria de mesa led articulada

# --- livros tecnicos: quedas de 30-50% sao comuns. Constroi confianca ---
livros:
  faixa_padrao: baixa
  termos:
    - clean code codigo limpo
    - clean architecture arquitetura limpa
    - o programador pragmatico
    - engenharia de software moderna
    - refatoracao martin fowler
    - livro sql do basico ao avancado
    - livro python para leigos
    - estruturas de dados e algoritmos
    - itil 4 foundation livro
    - livro scrum agil

# --- estudo e carreira: adjacencia natural da mesma pessoa (fase 2) ---
estudo:
  faixa_padrao: baixa
  termos:
    - mochila para notebook 15 polegadas
    - garrafa termica inox 500ml
    - caderno inteligente medio

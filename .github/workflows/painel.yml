name: Painel

# Tudo que voce faz na mao esta aqui, num menu so.
# Aba Actions > Painel > Run workflow > escolha a acao > Run workflow verde.
# O resultado aparece formatado no quadro "Summary" da execucao.

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "O que voce quer fazer"
        required: true
        default: diagnostico
        type: choice
        options:
          - diagnostico
          - descobrir_meu_chat_id
          - montar_o_catalogo
          - adicionar_um_produto
          - adicionar_varias_urls
          - processar_fila
          - ml_autorizar
          - ml_salvar_codigo
          - ml_testar
          - testar_uma_url
          - ver_demonstracao
      url:
        description: "URL(s) do produto, ou o codigo TG-... do Mercado Livre"
        required: false
        type: string
      categoria:
        description: "Categoria (so para adicionar um produto)"
        required: false
        default: perifericos
        type: string
      faixa:
        description: "Faixa de preco (so para adicionar um produto)"
        required: false
        default: media
        type: choice
        options: [baixa, media, alta]
      por_termo:
        description: "Produtos por termo de busca (so para montar o catalogo)"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

# Mesmo grupo do Radar automatico: os dois renovam a chave rotativa
# do Mercado Livre, e rodar em paralelo faria um invalidar a do outro.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  painel:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
      AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REFRESH_KEY: ${{ secrets.ML_REFRESH_KEY }}
      ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Executar
        env:
          ACAO: ${{ inputs.acao }}
          URL: ${{ inputs.url }}
          CATEGORIA: ${{ inputs.categoria }}
          FAIXA: ${{ inputs.faixa }}
          POR_TERMO: ${{ inputs.por_termo }}
        run: |
          set -o pipefail
          case "$ACAO" in
            diagnostico)
              python radar.py diagnostico | tee saida.txt ;;
            descobrir_meu_chat_id)
              python radar.py chatid | tee saida.txt ;;
            montar_o_catalogo)
              python radar.py catalogo --por-termo "$POR_TERMO" | tee saida.txt ;;
            adicionar_um_produto)
              if [ -z "$URL" ]; then
                echo "Preencha o campo URL." | tee saida.txt; exit 1; fi
              python radar.py adicionar "$URL" "$CATEGORIA" "$FAIXA" | tee saida.txt ;;
            adicionar_varias_urls)
              if [ -z "$URL" ]; then
                echo "Preencha o campo URL com os links." | tee saida.txt; exit 1; fi
              python radar.py adicionar_varias "$URL" "$CATEGORIA" "$FAIXA" | tee saida.txt ;;
            testar_uma_url)
              if [ -z "$URL" ]; then
                echo "Preencha o campo URL." | tee saida.txt; exit 1; fi
              python radar.py testar "$URL" | tee saida.txt ;;
            ml_autorizar)
              python radar.py ml_autorizar | tee saida.txt ;;
            ml_salvar_codigo)
              if [ -z "$URL" ]; then
                echo "Cole o codigo TG-... no campo URL." | tee saida.txt; exit 1; fi
              python radar.py ml_codigo "$URL" | tee saida.txt ;;
            ml_testar)
              python radar.py ml_testar "$URL" | tee saida.txt ;;
            processar_fila)
              python radar.py fila | tee saida.txt ;;
            ver_demonstracao)
              python radar.py demonstracao | tee saida.txt ;;
          esac

      - name: Mostrar o resultado
        if: always()
        run: |
          {
            echo "## ${{ inputs.acao }}"
            echo
            echo '```'
            cat saida.txt 2>/dev/null || echo "(sem saida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # SEMPRE, para qualquer acao. O Mercado Livre troca a chave de renovacao
      # a cada uso e invalida a anterior: se uma acao renovar e nao commitar a
      # chave nova, o repositorio fica com uma chave morta e tudo para.
      - name: Guardar o catalogo e as chaves
        if: always()
        run: |
          git config user.name  "baixou-bot"
          git config user.email "baixou-bot@users.noreply.github.com"
          git add -A dados 2>/dev/null || true
          git add catalogo.csv 2>/dev/null || true
          git add -A fila.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "${{ inputs.acao }}"
          # A chave do Mercado Livre e rotativa: se este push falhar, a chave
          # nova se perde e a anterior ja foi invalidada por eles. Entao aqui
          # a gente insiste, e falha alto se nao conseguir.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Gravado no repositorio."
              exit 0
            fi
            echo "push falhou (tentativa $tentativa) - trazendo o que mudou e repetindo"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::Nao consegui gravar dados/ml_token.enc no repositorio."
          echo "A chave do Mercado Livre foi renovada mas nao ficou salva."
          echo "Refaca ml_autorizar + ml_salvar_codigo."
          exit 1

      - uses: actions/upload-artifact@v4
        if: inputs.acao == 'ver_demonstracao'
        with:
          name: site-de-demonstracao
          path: site-demonstracao
          retention-days: 7

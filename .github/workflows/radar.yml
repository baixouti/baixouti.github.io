name: Radar automatico

# Roda sozinho de 2 em 2 horas. Voce nao precisa apertar nada aqui.
# Para rodar na hora: aba Actions > Radar automatico > Run workflow.

on:
  schedule:
    - cron: "5 */2 * * *"     # horario UTC. Brasilia = UTC-3.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
      AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REFRESH_KEY: ${{ secrets.ML_REFRESH_KEY }}
      ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
      ENCURTADOR_BASE: ${{ secrets.ENCURTADOR_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Coletar precos
        continue-on-error: true
        run: python radar.py coletar | tee coleta.txt

      - name: Processar o que voce aprovou
        continue-on-error: true
        run: python radar.py aprovacoes | tee aprovacoes.txt

      - name: Detectar quedas
        continue-on-error: true
        run: python radar.py detectar | tee deteccao.txt

      - name: Gerar o site
        run: python radar.py site

      - name: Resumo da rodada
        if: always()
        run: |
          {
            echo "## Rodada de $(date -u +'%d/%m/%Y %H:%M') UTC"
            echo
            echo "### Quedas detectadas"
            echo '```'
            tail -4 deteccao.txt 2>/dev/null || echo "(nao rodou)"
            echo '```'
            echo "### Aprovacoes processadas"
            echo '```'
            cat aprovacoes.txt 2>/dev/null || echo "(nao rodou)"
            echo '```'
            echo "### Coleta"
            echo '```'
            tail -3 coleta.txt 2>/dev/null || echo "(nao rodou)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o historico de precos
        if: always()
        run: |
          git config user.name  "baixou-bot"
          git config user.email "baixou-bot@users.noreply.github.com"
          # O banco pode nao existir ainda (catalogo vazio na primeira rodada).
          # Sem o -A o git falha e derruba a publicacao do site.
          git add -A dados 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada de novo no historico."
          else
            git commit -m "precos: $(date -u +'%d/%m %H:%M') UTC"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  publicar:
    needs: rodada
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
